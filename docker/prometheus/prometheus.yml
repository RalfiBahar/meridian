global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Ingest workers expose /metrics on the Compose network (see ingest-kalshi).
  - job_name: "meridian-kalshi"
    static_configs:
      - targets: ["ingest-kalshi:9091"]

  - job_name: "meridian-polymarket"
    static_configs:
      - targets: ["ingest-polymarket:9092"]
