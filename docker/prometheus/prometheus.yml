global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "meridian-kalshi"
    static_configs:
      - targets: ["host.docker.internal:9091"]
    # default scrape path is /metrics

  - job_name: "meridian-polymarket"
    static_configs:
      - targets: ["host.docker.internal:9092"]
