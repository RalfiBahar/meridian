# Fly.io config for the Meridian FastAPI backend.
# Deploy with: flyctl deploy --config fly.toml
# Secrets: flyctl secrets set MERIDIAN_API_KEYS=key1,key2 DATABASE_URL=... REDIS_URL=...

app = "meridian-api"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
