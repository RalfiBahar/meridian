# Fly.io config for the Meridian Next.js frontend.
# Deploy with: cd frontend && flyctl deploy --config fly.toml
# Secrets: flyctl secrets set MERIDIAN_API_URL=https://meridian-api.fly.dev
#          flyctl secrets set NEXT_PUBLIC_WS_URL=wss://meridian-api.fly.dev

app = "meridian-frontend"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    MERIDIAN_API_URL = "https://meridian-api.fly.dev"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/"
    protocol = "http"
    timeout = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
