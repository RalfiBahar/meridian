services:
  timescale:
    image: timescale/timescaledb:latest-pg16
    container_name: meridian-timescale
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      - "5433:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./docker/timescale/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: meridian-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  ingest-kalshi:
    build: .
    container_name: meridian-ingest-kalshi
    command:
      - python
      - -m
      - meridian.cli
      - ingest
      - kalshi
      - --tickers
      - KXFED-27APR-T4.25,KXFED-27APR-T4.00,KXFED-27APR-T3.75,KXFED-27APR-T3.50,KXFED-27APR-T3.25,KXFED-27APR-T3.00,KXHIGHNY-26JUN19-B83.5,KXHIGHNY-26JUN19-B85.5,KXHIGHNY-26JUN19-B87.5
    env_file:
      - .env
    environment:
      MERIDIAN_POSTGRES_DSN: postgresql://meridian:meridian@timescale:5432/meridian
      MERIDIAN_REDIS_URL: redis://redis:6379/0
      MERIDIAN_KALSHI_PRIVATE_KEY_PATH: /run/secrets/kalshi-private-key.pem
    volumes:
      - ${HOME}/.config/meridian/kalshi-private-key.pem:/run/secrets/kalshi-private-key.pem:ro
    depends_on:
      timescale:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  ingest-polymarket:
    build: .
    container_name: meridian-ingest-polymarket
    command:
      - python
      - -m
      - meridian.cli
      - ingest
      - polymarket
      - --assets
      - 88275040060084773376557187972215267513049848642895776801789297917961077894224,94376205816022955542979635542279932967359915765455578534002478996104754801969,21695138873211375451055566770107682325494206727818897067665810321709249824909
    env_file:
      - .env
    environment:
      MERIDIAN_POSTGRES_DSN: postgresql://meridian:meridian@timescale:5432/meridian
      MERIDIAN_REDIS_URL: redis://redis:6379/0
    depends_on:
      timescale:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: meridian-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:latest
    container_name: meridian-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: meridian
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  timescale-data:
  redis-data:
  prometheus-data:
  grafana-data:
